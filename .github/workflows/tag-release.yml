name: Tag release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify successful commit checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Detect version bump
        id: version
        shell: bash
        run: |
          set -euo pipefail

          current="$(sed -nE 's/^const Version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' internal/runner/runner.go)"
          if [[ -z "$current" ]]; then
            echo "Could not read Runner version" >&2
            exit 1
          fi

          parent="$(git rev-parse HEAD^1 2>/dev/null || true)"
          if [[ -z "$parent" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous="$(git show "$parent:internal/runner/runner.go" 2>/dev/null | sed -nE 's/^const Version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' || true)"
          if [[ "$current" == "$previous" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$current" >> "$GITHUB_OUTPUT"
          echo "tag=v$current" >> "$GITHUB_OUTPUT"

      - name: Create immutable release tag
        if: steps.version.outputs.changed == 'true'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            existing="$(git rev-list -n 1 "$TAG")"
            if [[ "$existing" != "$RELEASE_SHA" ]]; then
              echo "$TAG already exists at $existing; refusing to move an immutable release tag" >&2
              exit 1
            fi
            echo "$TAG already points to $RELEASE_SHA"
            exit 0
          fi

          git tag "$TAG" "$RELEASE_SHA"
          git push origin "$TAG"
